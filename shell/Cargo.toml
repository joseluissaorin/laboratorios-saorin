[package]
name = "laboratorios-saorin"
version = "0.1.0"
edition = "2021"
description = "LABORATORIOS SAORÍN — estudio de vídeo con revelado fílmico"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tiny_http = "0.12"
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
lto = true
opt-level = 2
