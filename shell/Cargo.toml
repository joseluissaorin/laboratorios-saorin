[package]
name = "laboratorios-saorin"
version = "0.1.0"
edition = "2021"
description = "LABORATORIOS SAORÍN — estudio de vídeo con revelado fílmico"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tiny_http = "0.12"
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
serde_json = "1"
percent-encoding = "2"
# EL OÍDO: whisper.cpp enlazado estático. En el Mac por Metal; en Windows por
# CPU (el HX 370 es Zen 5 con AVX-512 y doce núcleos, y ggml los usa).
whisper-rs = { version = "0.16", default-features = false, optional = true }

# EN WINDOWS, VULKAN: el oído corre en la Radeon 890M en vez de en la CPU.
# Pide el SDK de Vulkan instalado para compilar (glslc y las cabeceras).
[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["vulkan"], optional = true }

# Metal SOLO en el Mac: en Windows ni existe, y pedirlo allí no compila.
# OJO: aquí abajo sólo va lo que es DE ESTA PLATAFORMA. Lo común vive arriba —
# poner una dependencia común en este bloque la hace desaparecer en Windows y
# el taller se queda sin serde_json, sin tiny_http y sin nada (ya pasó).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"], optional = true }

[features]
# EL OÍDO se puede dejar fuera. whisper.cpp se enlaza con bindgen, que pide
# libclang: en una máquina sin LLVM el taller entero no compilaría por una
# función que igual no se usa. Con `--no-default-features` el revelado sigue
# saliendo y el oído avisa de que no está.
default = ["oido", "ventana"]
oido = ["dep:whisper-rs"]
# LA VENTANA DEL ESTUDIO VIEJO (webview de Tauri). El editor NATIVO la
# sustituyó; lo que se usa de este binario es `cli` (revelar, el oído) y
# `serve`. Se deja porque funciona, pero no se le debe la compilación: en
# Windows tauri-build 2.6 no encuentra el `cargo:dev` de tauri y tumbaba el
# taller ENTERO por una ventana que ya no abre nadie.
ventana = ["dep:tauri", "dep:tauri-build"]

[profile.release]
lto = true
opt-level = 2
