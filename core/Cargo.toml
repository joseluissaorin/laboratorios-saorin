[package]
name = "filmlook-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "24"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
winit = "0.30"
# las fotos y los rótulos como fuentes del motor (PENDIENTE §4bis.10)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
# LA MISMA VALIDACIÓN QUE HACE wgpu. Un shader puede traducirse a Metal y aun
# así no pasar el validador que corre en Windows al crear el módulo: eso ya
# costó un viaje entero al GPD. Aquí se comprueba en el Mac, en un segundo.
naga = { version = "24", features = ["wgsl-in"] }
