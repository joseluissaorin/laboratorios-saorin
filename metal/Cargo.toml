[package]
name = "filmlook-metal"
version = "0.1.0"
edition = "2021"

[dependencies]
metal = "0.29"
objc = "0.2"
core-foundation = "0.9"
block = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
crossbeam-channel = "0.5"
# las fotos y los rótulos como fuentes residentes (PENDIENTE §4bis.10)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[build-dependencies]
# naga ya viene con wgpu; aquí se usa suelto para traducir el WGSL a Metal
naga = { version = "24", features = ["wgsl-in", "msl-out"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
