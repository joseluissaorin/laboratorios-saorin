<!-- ZINE DOODLES — the studio's hand-drawn mark drawer (sun, aster, heart,
     arrow, spiral, zig, stem, daisy, scissors, wave, star, bee, stamp, reg).
     Injected into each page by doodles.js; reference as <use href="#d-..."/>.
     Every stroke keeps its wobble: these are drawings, not icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- a hand-drawn sun -->
    <g id="d-sun">
      <circle cx="30" cy="30" r="13" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"
        transform="rotate(-4 30 30)"/>
      <path d="M30 6 L30 12 M47 12 L43 17 M54 30 L47 30 M47 48 L43 43 M30 54 L30 47 M13 48 L17 43 M6 30 L13 30 M13 12 L17 17"
        fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <!-- the asterisk-flower, our little signature -->
    <g id="d-aster">
      <path d="M15 3 L15 27 M4 9 L26 21 M26 9 L4 21"
        fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"
        transform="rotate(6 15 15)"/>
    </g>
    <!-- a quick heart, one go of the pen -->
    <g id="d-heart">
      <path d="M12 20 C 4 14, 1 9, 3 5 C 5 1, 10 2, 12 6 C 14 2, 19 1, 21 5 C 23 9, 20 14, 12 20 Z"
        fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
    </g>
    <!-- a curly arrow that can't fly straight -->
    <g id="d-arrow">
      <path d="M4 8 C 22 2, 38 22, 56 14 C 64 10, 68 16, 74 22"
        fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M66 24 L75 23 L71 14" fill="none" stroke="currentColor" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- a spiral thought -->
    <g id="d-spiral">
      <path d="M25 25 C 27 22, 31 23, 31 27 C 31 32, 25 34, 21 31 C 15 27, 17 18, 24 15 C 33 11, 43 18, 43 28 C 43 39, 32 46, 21 43"
        fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- a zigzag bite -->
    <g id="d-zig">
      <path d="M3 16 L13 4 L22 16 L32 4 L41 16 L51 4 L60 16"
        fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- a sprouting stem -->
    <g id="d-stem">
      <path d="M20 58 C 22 40, 18 28, 22 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M21 34 C 12 30, 8 22, 10 16 C 18 18, 22 26, 21 34 Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M21 44 C 30 40, 34 34, 33 27 C 25 29, 20 36, 21 44 Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
    </g>
    <!-- a five-petal daisy, seven strokes -->
    <g id="d-daisy">
      <circle cx="26" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M26 18 C 22 8, 32 8, 26 18 M33 22 C 43 16, 46 25, 34 25 M31 32 C 39 40, 30 45, 28 33 M20 32 C 13 42, 5 35, 17 29 M19 22 C 8 18, 13 8, 22 17"
        fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <!-- scissors on the dotted line -->
    <g id="d-scissors">
      <circle cx="8" cy="10" r="4.5" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="8" cy="26" r="4.5" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <path d="M12 13 L34 22 M12 23 L34 14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <!-- a wavy underline -->
    <g id="d-wave">
      <path d="M2 8 C 10 2, 18 14, 26 8 C 34 2, 42 14, 50 8 C 58 2, 66 14, 74 8"
        fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <!-- a shy star -->
    <g id="d-star">
      <path d="M14 2 L17 10 L26 11 L19 17 L21 26 L14 21 L7 26 L9 17 L2 11 L11 10 Z"
        fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"
        transform="rotate(-8 14 14)"/>
    </g>
    <!-- a bee: two circles, two wings, one dotted flight line -->
    <g id="d-bee">
      <ellipse cx="46" cy="26" rx="9" ry="7" fill="none" stroke="currentColor" stroke-width="2.7" transform="rotate(-12 46 26)"/>
      <path d="M42 22 L49 31 M46 20 L52 28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M42 18 C 38 10, 46 8, 46 17 M50 17 C 52 8, 60 12, 53 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M4 38 C 12 30, 20 42, 30 33" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 6"/>
    </g>
    <!-- the pressed stamp: a circle of type -->
    <g id="d-stamp">
      <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="60" cy="60" r="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 6"/>
      <path id="stamp-arc" d="M60 16 a44 44 0 1 1 -0.01 0" fill="none"/>
    </g>
    <!-- registration cross -->
    <g id="d-reg">
      <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10 0 L10 20 M0 10 L20 10" stroke="currentColor" stroke-width="1.6"/>
    </g>
  </defs>
</svg>
